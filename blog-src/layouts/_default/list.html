<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}Writing — trnrhx{{ else }}{{ .Title }} — trnrhx{{ end }}</title>
  <link rel="stylesheet" href="{{ "blog.css" | relURL }}">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <a class="site-title" href="{{ .Site.Home.RelPermalink }}">Writing</a>
      <nav class="site-nav">
        <a href="/">trnrhx.com</a>
      </nav>
    </header>
    <ul class="post-list">
      {{ range .Site.RegularPages.ByDate.Reverse }}
      <li class="post-row">
        <a href="{{ .RelPermalink }}">
          <span class="post-row-title">{{ .Title }}</span>
          <time class="post-row-date">{{ .Date.Format "Jan 02, 2006" }}</time>
        </a>
        {{ with .Description }}<p class="post-row-desc">{{ . }}</p>{{ end }}
      </li>
      {{ end }}
    </ul>
  </main>
</body>
</html>
