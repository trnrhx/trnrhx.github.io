<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — trnrhx</title>
  <link rel="stylesheet" href="{{ "blog.css" | relURL }}">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <a class="site-title" href="{{ .Site.Home.RelPermalink }}">Writings</a>
      <nav class="site-nav">
        <a href="/">trnrhx.com</a>
      </nav>
    </header>
    <article>
      <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">{{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read</div>
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
      <footer class="post-footer">
        <a href="{{ .Site.Home.RelPermalink }}">← All posts</a>
      </footer>
    </article>
  </main>
</body>
</html>
